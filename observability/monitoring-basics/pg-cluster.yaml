apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster
  namespace: default
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  storage:
    size: 1Gi

  # Nothing monitoring-specific to configure here: the exporter on port
  # 9187 and the cnpg-default-monitoring query set are both on by default
  # (disableDefaultQueries defaults to false). See the PodMonitor below for
  # the one piece that IS now on you.
